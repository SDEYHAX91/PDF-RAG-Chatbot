[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.23",
    "dotenv>=0.9.9",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.3",
    "pypdf>=6.19.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "torchvision>=0.29.1",
]

[project.scripts]
rag-chatbot = "rag_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
extraPaths = ["."]

